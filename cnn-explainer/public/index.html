<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="DNN Explainer" />
    <meta
      name="description"
      content="An interactive visualization system designed to help non-experts learn about dense (fully connected) neural networks."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DNN Explainer" />
    <meta
      property="og:description"
      content="An interactive visualization system designed to help non-experts learn about dense (fully connected) neural networks."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="DNN Explainer" />
    <meta
      property="twitter:description"
      content="An interactive visualization system designed to help non-experts learn about dense (fully connected) neural networks."
    />

    <title>DNN Explainer</title>

    <!-- Relative paths so the page works at a domain root and under a
         project subpath (e.g. GitHub Pages) without a rebuild. -->
    <link rel="icon" type="image/png" href="./assets/img/favicon.png" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./bundle.css" />

    <link
      href="https://fonts.googleapis.com/css?family=Neucha&display=swap"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v5.js"></script>

    <script defer src="./bundle.js"></script>

    <style>
      @font-face {
        font-family: 'A Love of Thunder';
        src: URL('./assets/font/A Love of Thunder.ttf') format('truetype');
      }
    </style>
  </head>

  <body></body>
</html>
